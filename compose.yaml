services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - dokploy-network
    environment:
      YII_ENV: ${YII_ENV:-prod}
      YII_DEBUG: ${YII_DEBUG:-0}
      JWT_KEY: ${JWT_KEY:?JWT_KEY debe configurarse en Dokploy}
      DB_HOST: ${DB_HOST:?DB_HOST debe configurarse en Dokploy}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?DB_NAME debe configurarse en Dokploy}
      DB_USER: ${DB_USER:?DB_USER debe configurarse en Dokploy}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD debe configurarse en Dokploy}

networks:
  dokploy-network:
    external: true
